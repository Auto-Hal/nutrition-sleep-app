project_id = "nutrition-sleep-app"

[api]
enabled = true
schemas = ["public", "storage"]

[db]
port = 54322
shadow_port = 54320

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Global signup policy; invited/admin-created users can still sign in.
enable_signup = false
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[auth.email]
# This switch enables the email provider itself in the local CLI runtime.
# Public signup remains disabled by [auth].enable_signup above.
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
