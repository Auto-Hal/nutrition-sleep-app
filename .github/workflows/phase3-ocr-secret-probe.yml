name: Phase 3 OCR secret probe

on:
  push:
    branches:
      - phase/3-product-ingestion
    paths:
      - .github/workflows/phase3-ocr-secret-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select dedicated Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_aTOsma3gZ9xkcFkGJ53dUCCO","projectId":"prj_WiPB989mXurOuIgVm8asfmfdPA6W"}
          JSON
      - name: List only Google/Vision environment-variable metadata
        shell: bash
        run: |
          npx --yes vercel@latest --token=${{ secrets.VERCEL_TOKEN }} env ls --format json             | node -e '
              let input="";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const data = JSON.parse(input);
                const rows = Array.isArray(data) ? data : (data.envs || data.variables || []);
                const filtered = rows
                  .filter(row => /GOOGLE|VISION/i.test(String(row.key || row.name || "")))
                  .map(row => ({
                    key: row.key || row.name,
                    target: row.target || row.targets || null,
                    type: row.type || null,
                    gitBranch: row.gitBranch || null
                  }));
                console.log(JSON.stringify(filtered, null, 2));
              });
            '
