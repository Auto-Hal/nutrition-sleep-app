name: Phase 3 OCR secret probe

on:
  push:
    branches:
      - phase/3-product-ingestion
    paths:
      - .github/workflows/phase3-ocr-secret-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select dedicated Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_aTOsma3gZ9xkcFkGJ53dUCCO","projectId":"prj_WiPB989mXurOuIgVm8asfmfdPA6W"}
          JSON
      - name: Probe generic Preview secret injection
        shell: bash
        run: |
          npx --yes vercel@latest --token=${{ secrets.VERCEL_TOKEN }} env run -e preview --             node -e 'console.log("GENERIC_PREVIEW_VISION_KEY_PRESENT=" + Boolean(process.env.GOOGLE_CLOUD_VISION_API_KEY))'
      - name: Probe Phase 3 branch Preview secret injection
        shell: bash
        run: |
          npx --yes vercel@latest --token=${{ secrets.VERCEL_TOKEN }} env run -e preview --git-branch=phase/3-product-ingestion --             node -e 'console.log("PHASE3_PREVIEW_VISION_KEY_PRESENT=" + Boolean(process.env.GOOGLE_CLOUD_VISION_API_KEY))'
