name: Preview

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          APP_SESSION_ENCRYPTION_KEY: ${{ secrets.PREVIEW_APP_SESSION_ENCRYPTION_KEY }}
      - name: Select the dedicated Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_aTOsma3gZ9xkcFkGJ53dUCCO","projectId":"prj_WiPB989mXurOuIgVm8asfmfdPA6W"}
          JSON
      - name: Report optional Preview provider configuration
        id: yahoo-config
        shell: bash
        run: |
          set +x
          ENV_LIST="$(pnpm dlx vercel@48.2.0 env ls preview phase/6.11-full-mvp-acceptance --token=${{ secrets.VERCEL_TOKEN }} 2>&1)"
          if printf '%s\n' "$ENV_LIST" | grep -Fq 'YAHOO_SHOPPING_CLIENT_ID'; then
            echo 'Yahoo Shopping Preview credential: PRESENT' >> "$GITHUB_STEP_SUMMARY"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Yahoo Shopping Preview credential: MISSING' >> "$GITHUB_STEP_SUMMARY"
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::warning::YAHOO_SHOPPING_CLIENT_ID is not configured for the Vercel Preview environment.'
          fi
      - name: Inspect Vercel curl compatibility
        if: steps.yahoo-config.outputs.present == 'true'
        shell: bash
        run: pnpm dlx vercel@48.2.0 curl --help
      - name: Run Yahoo real-JAN acceptance against protected Preview runtime
        if: steps.yahoo-config.outputs.present == 'true'
        shell: bash
        env:
          PREVIEW_URL: https://nutrition-sleep-p7vuxrhzx-tsuno2.vercel.app
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +x
          for batch in 0 1 2 3; do
            pnpm dlx vercel@48.2.0 curl "/api/acceptance/yahoo-real-jan?batch=$batch" \
              --deployment "$PREVIEW_URL" \
              --token="$VERCEL_TOKEN" \
              > "$RUNNER_TEMP/yahoo-batch-$batch.json"
            if [ "$batch" -lt 3 ]; then sleep 2; fi
          done
          node <<'NODE'
          const fs = require("fs");
          const rows = [];
          for (let batch = 0; batch < 4; batch += 1) {
            const raw = fs.readFileSync(process.env.RUNNER_TEMP + `/yahoo-batch-${batch}.json`, "utf8").trim();
            let payload;
            try {
              payload = JSON.parse(raw);
            } catch {
              console.error(`Yahoo acceptance batch ${batch} did not return JSON.`);
              process.exit(2);
            }
            if (
              payload.acceptance !== "yahoo-real-jan"
              || payload.batch !== batch
              || payload.sample_count !== 5
              || payload.exact_jan_validation !== true
              || payload.identity_only !== true
              || payload.nutrition_authority !== false
              || payload.raw_provider_payload_returned !== false
              || !Array.isArray(payload.results)
              || payload.results.length !== 5
            ) {
              console.error(`Yahoo acceptance batch ${batch} returned an invalid contract.`);
              process.exit(2);
            }
            rows.push(...payload.results);
          }

          const unavailable = rows.filter((row) => row.status === "unavailable");
          const usable = rows.filter((row) => row.status === "found" || row.status === "ambiguous");
          const notFound = rows.filter((row) => row.status === "not_found");
          const ambiguous = rows.filter((row) => row.status === "ambiguous");
          const exactInvariantBroken = usable.filter((row) =>
            row.exact_returned_jan_required !== true
            || row.identity_only !== true
            || row.nutrition_adopted !== false
          );

          if (rows.length !== 20 || unavailable.length > 0 || usable.length === 0 || exactInvariantBroken.length > 0) {
            console.error("YAHOO_REAL_JAN_ACCEPTANCE=FAIL");
            console.error(JSON.stringify({
              sample_count: rows.length,
              usable_exact_jan_samples: usable.length,
              ambiguous_samples: ambiguous.length,
              not_found_samples: notFound.length,
              unavailable_samples: unavailable.length,
              invariant_failures: exactInvariantBroken.length,
            }));
            process.exit(2);
          }

          console.log("YAHOO_REAL_JAN_ACCEPTANCE=PASS");
          console.log(JSON.stringify({
            sample_count: rows.length,
            usable_exact_jan_samples: usable.length,
            ambiguous_samples: ambiguous.length,
            not_found_samples: notFound.length,
            unavailable_samples: unavailable.length,
            identity_only: true,
            nutrition_authority: false,
            raw_provider_payload_returned: false,
          }));
          NODE
          rm -f "$RUNNER_TEMP"/yahoo-batch-*.json
      - run: pnpm dlx vercel@48.2.0 pull --yes --environment=preview --git-branch=phase/6.11-full-mvp-acceptance --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@48.2.0 build --target=preview --yes --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@48.2.0 deploy --prebuilt --target=preview --token=${{ secrets.VERCEL_TOKEN }}
