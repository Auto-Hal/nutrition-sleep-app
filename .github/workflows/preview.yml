name: Preview

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          APP_SESSION_ENCRYPTION_KEY: ${{ secrets.PREVIEW_APP_SESSION_ENCRYPTION_KEY }}
      - name: Select the dedicated Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_aTOsma3gZ9xkcFkGJ53dUCCO","projectId":"prj_WiPB989mXurOuIgVm8asfmfdPA6W"}
          JSON
      - name: Report optional Preview provider configuration
        id: yahoo-config
        shell: bash
        run: |
          set +x
          ENV_LIST="$(pnpm dlx vercel@48.2.0 env ls preview phase/6.11-full-mvp-acceptance --token=${{ secrets.VERCEL_TOKEN }} 2>&1)"
          if printf '%s\n' "$ENV_LIST" | grep -Fq 'YAHOO_SHOPPING_CLIENT_ID'; then
            echo 'Yahoo Shopping Preview credential: PRESENT' >> "$GITHUB_STEP_SUMMARY"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Yahoo Shopping Preview credential: MISSING' >> "$GITHUB_STEP_SUMMARY"
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::warning::YAHOO_SHOPPING_CLIENT_ID is not configured for the Vercel Preview environment.'
          fi
      - run: pnpm dlx vercel@48.2.0 pull --yes --environment=preview --git-branch=phase/6.11-full-mvp-acceptance --token=${{ secrets.VERCEL_TOKEN }}
      - name: Load Yahoo Preview credential for live acceptance
        if: steps.yahoo-config.outputs.present == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +x
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/prj_WiPB989mXurOuIgVm8asfmfdPA6W/env?gitBranch=phase%2F6.11-full-mvp-acceptance&decrypt=true&source=vercel-cli%3Apull&teamId=team_aTOsma3gZ9xkcFkGJ53dUCCO" \
            --output "$RUNNER_TEMP/vercel-preview-env.json"
          node <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/vercel-preview-env.json", "utf8"));
          const row = (payload.envs ?? []).find((item) =>
            item.key === "YAHOO_SHOPPING_CLIENT_ID"
            && Array.isArray(item.target)
            && item.target.includes("preview")
          );
          if (!row || typeof row.value !== "string" || row.value.length === 0) {
            console.error("Yahoo Preview credential could not be decrypted for acceptance.");
            process.exit(2);
          }
          console.log("::add-mask::" + row.value);
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            "YAHOO_SHOPPING_CLIENT_ID<<YAHOO_EOF\n" + row.value + "\nYAHOO_EOF\n",
          );
          console.log("Yahoo Shopping Preview credential: DECRYPTED_FOR_ACCEPTANCE");
          NODE
          rm -f "$RUNNER_TEMP/vercel-preview-env.json"
      - name: Run Yahoo real-JAN acceptance
        if: steps.yahoo-config.outputs.present == 'true'
        shell: bash
        run: |
          set +x
          node scripts/yahoo-real-jan-acceptance.mjs
      - run: pnpm dlx vercel@48.2.0 build --target=preview --yes --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@48.2.0 deploy --prebuilt --target=preview --token=${{ secrets.VERCEL_TOKEN }}
