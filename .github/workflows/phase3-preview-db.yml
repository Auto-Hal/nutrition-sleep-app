name: Phase 3 Preview config

on:
  push:
    branches:
      - phase/3-product-ingestion
    paths:
      - .github/workflows/phase3-preview-db.yml

permissions:
  contents: read

jobs:
  update-origin:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select dedicated Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_aTOsma3gZ9xkcFkGJ53dUCCO","projectId":"prj_WiPB989mXurOuIgVm8asfmfdPA6W"}
          JSON
      - name: Update Preview APP_ORIGIN
        shell: bash
        run: |
          printf '%s\n' 'https://nutrition-sleep-app-git-phase-3-product-ingestion-tsuno2.vercel.app'             | npx --yes vercel@48.2.0 env update APP_ORIGIN preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Verify variable remains in Preview scope
        run: npx --yes vercel@48.2.0 env ls preview --token=${{ secrets.VERCEL_TOKEN }}
