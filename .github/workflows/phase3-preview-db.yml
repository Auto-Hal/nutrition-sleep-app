name: Phase 3 Preview DB rollout

on:
  push:
    branches:
      - phase/3-product-ingestion
    paths:
      - .github/workflows/phase3-preview-db.yml

permissions:
  contents: read

jobs:
  identify-target:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select dedicated Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_aTOsma3gZ9xkcFkGJ53dUCCO","projectId":"prj_WiPB989mXurOuIgVm8asfmfdPA6W"}
          JSON
      - name: Pull Preview environment
        run: npx --yes vercel@48.2.0 pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Print sanitized database target metadata
        shell: bash
        run: |
          set -a
          source .vercel/.env.preview.local
          set +a
          test -n "$DATABASE_URL"
          node - <<'NODE'
          const u = new URL(process.env.DATABASE_URL);
          console.log(JSON.stringify({
            protocol: u.protocol,
            hostname: u.hostname,
            port: u.port || null,
            username: decodeURIComponent(u.username),
            database: u.pathname.replace(/^\//, "")
          }, null, 2));
          NODE
          case "$DATABASE_URL" in
            *vyvnicyupcrsmtgdyypv*)
              echo "Production ref detected. Refusing all writes." >&2
              exit 1
              ;;
          esac
          echo "Diagnostic only: no database writes were performed."
