name: Phase 3 Preview DB rollout

on:
  push:
    branches:
      - phase/3-product-ingestion
    paths:
      - .github/workflows/phase3-preview-db.yml

permissions:
  contents: read

jobs:
  migrate-and-smoke:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Verify Preview database target
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          case "$DATABASE_URL" in
            *pprsfxpfljdjlwdfbtqo*) ;;
            *)
              echo "Refusing migration: DATABASE_URL is not the dedicated Preview Supabase project." >&2
              exit 1
              ;;
          esac
          echo "Preview database target verified."
      - name: Show migration ledger before
        run: supabase migration list --db-url "$DATABASE_URL"
      - name: Apply pending migrations
        run: supabase db push --db-url "$DATABASE_URL" --yes
      - name: Show migration ledger after
        run: supabase migration list --db-url "$DATABASE_URL"
      - name: Run rollback-only Phase 3 smoke
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/smoke/phase3_products.sql
