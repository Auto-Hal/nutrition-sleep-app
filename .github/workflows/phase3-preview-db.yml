name: Phase 3 Preview DB rollout

on:
  push:
    branches:
      - phase/3-product-ingestion
    paths:
      - .github/workflows/phase3-preview-db.yml

permissions:
  contents: read

jobs:
  identify-target:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select dedicated Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_aTOsma3gZ9xkcFkGJ53dUCCO","projectId":"prj_WiPB989mXurOuIgVm8asfmfdPA6W"}
          JSON
      - name: Diagnose encrypted Preview DB target with env run
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          npx --yes vercel@48.2.0 env run -e preview -- node - <<'NODE'
          const value = process.env.DATABASE_URL || "";
          if (!value) {
            console.error("DATABASE_URL was not injected.");
            process.exit(1);
          }
          const u = new URL(value);
          console.log(JSON.stringify({
            hostname: u.hostname,
            port: u.port || null,
            username: decodeURIComponent(u.username),
            database: u.pathname.replace(/^\//, "")
          }, null, 2));
          if (value.includes("vyvnicyupcrsmtgdyypv")) {
            console.error("Production ref detected. Refusing all writes.");
            process.exit(2);
          }
          console.log("Diagnostic only: no database writes were performed.");
          NODE
