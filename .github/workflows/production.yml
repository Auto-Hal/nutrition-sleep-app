name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # VERCEL_TOKEN is currently stored in the GitHub preview environment.
    # This manual workflow is used only after explicit release approval.
    # Secret values remain inside the remote Vercel build.
    if: github.ref == 'refs/heads/main'
    environment: preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select the dedicated Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_aTOsma3gZ9xkcFkGJ53dUCCO","projectId":"prj_WiPB989mXurOuIgVm8asfmfdPA6W"}
          JSON
      - name: Build and deploy the approved main commit inside Vercel
        run: pnpm dlx vercel@48.2.0 deploy --target=production --yes --meta "githubCommitSha=$PRODUCTION_GIT_SHA" --meta "githubCommitRef=main" --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_GIT_SHA: ${{ github.sha }}
