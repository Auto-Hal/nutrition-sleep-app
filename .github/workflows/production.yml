name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production.yml"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # VERCEL_TOKEN is currently stored in the GitHub preview environment.
    # Vercel itself is still pulled/built/deployed with the production target.
    environment: preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select the dedicated Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_aTOsma3gZ9xkcFkGJ53dUCCO","projectId":"prj_WiPB989mXurOuIgVm8asfmfdPA6W"}
          JSON
      - run: pnpm dlx vercel@48.2.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@48.2.0 build --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@48.2.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
