name: Stage approved nutrition Production build

on:
  push:
    branches: [release/nutrition-v2-stage]

permissions:
  contents: read

concurrency:
  group: stage-nutrition-production
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build approved source with Production environment, without assigning domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const source = '34824c1d0362c0bc74e861459f13ef3067e3bfe2';
          const team = 'team_aTOsma3gZ9xkcFkGJ53dUCCO';
          if (!process.env.VERCEL_TOKEN) throw new Error('Vercel credential is unavailable');
          const headers = { Authorization: `Bearer ${process.env.VERCEL_TOKEN}`, 'Content-Type': 'application/json' };
          async function api(path, options = {}) {
            const response = await fetch(`https://api.vercel.com${path}?teamId=${team}`, { ...options, headers });
            const body = await response.json();
            if (!response.ok) throw new Error(`Vercel API status ${response.status}, code ${body.error?.code ?? 'unknown'}`);
            return body;
          }
          const created = await api('/v13/deployments', {
            method: 'POST',
            body: JSON.stringify({
              name: 'nutrition-sleep-app',
              project: 'prj_WiPB989mXurOuIgVm8asfmfdPA6W',
              deploymentId: 'dpl_FGCnnR29FyQhBnZXBM6TQqSsFk22',
              withLatestCommit: false,
              target: 'production',
              autoAssignCustomDomains: false,
              meta: { githubCommitSha: source, githubCommitRef: 'fix/unified-calorie-total', releaseScope: 'recorded-calorie-total-fix-staged' }
            })
          });
          if (!created.id) throw new Error('Missing deployment ID');
          console.log(JSON.stringify({ id: created.id, url: created.url, target: created.target, state: created.readyState }));
          let ready;
          for (let attempt = 0; attempt < 78; attempt++) {
            const deployment = await api(`/v13/deployments/${created.id}`);
            if (['ERROR', 'CANCELED'].includes(deployment.readyState)) throw new Error(`Build ${deployment.readyState}`);
            if (deployment.readyState === 'READY') { ready = deployment; break; }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!ready) throw new Error('Build did not become READY');
          const actualSource = ready.meta?.githubCommitSha ?? ready.gitSource?.sha;
          if (ready.target !== 'production' || actualSource !== source) throw new Error('Deployment target/source mismatch');
          const liveResponse = await fetch('https://nutrition-sleep-app.vercel.app/api/app-version', { cache: 'no-store' });
          if (!liveResponse.ok) throw new Error(`Live version status ${liveResponse.status}`);
          const live = await liveResponse.json();
          console.log(JSON.stringify({ id: ready.id, url: ready.url, target: ready.target, state: ready.readyState, source: actualSource, liveVersion: live }));
          if (JSON.stringify(live).includes(source)) throw new Error('Staged source unexpectedly owns the public domain');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Staged Production build: https://${ready.url}\n\nDeployment: ${ready.id}\n\nSource: ${source}\n\nPublic domain was not switched.\n`);
          JS
