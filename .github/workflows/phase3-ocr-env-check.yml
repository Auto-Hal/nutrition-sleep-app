name: Phase 3 Preview OCR env check

on:
  push:
    branches:
      - phase/3-product-ingestion
    paths:
      - .github/workflows/phase3-ocr-env-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select dedicated Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_aTOsma3gZ9xkcFkGJ53dUCCO","projectId":"prj_WiPB989mXurOuIgVm8asfmfdPA6W"}
          JSON
      - name: Verify Cloud Vision key metadata in Preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@48.2.0 env ls preview --token=${{ secrets.VERCEL_TOKEN }} > /tmp/env-list.txt
          grep -F 'GOOGLE_CLOUD_VISION_API_KEY' /tmp/env-list.txt
          if grep -F 'GOOGLE_CLOUD_VISION_API_KEY' /tmp/env-list.txt | grep -Eiq 'Production|Development'; then
            echo "Unexpected non-Preview scope shown for Cloud Vision key." >&2
            exit 1
          fi
          echo "Cloud Vision Preview environment variable metadata is present."
