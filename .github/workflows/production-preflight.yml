name: Production Preflight

on:
  push:
    branches:
      - phase/6.11-full-mvp-acceptance
    paths:
      - .github/workflows/production-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    environment: preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Select the dedicated Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_aTOsma3gZ9xkcFkGJ53dUCCO","projectId":"prj_WiPB989mXurOuIgVm8asfmfdPA6W"}
          JSON

      - name: Check Production environment names
        shell: bash
        run: |
          set -euo pipefail
          output="$(pnpm dlx vercel@48.2.0 env ls production --token="${{ secrets.VERCEL_TOKEN }}" 2>&1)"
          required=(
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            DATABASE_URL
            APP_SESSION_ENCRYPTION_KEY
            APP_ALLOWED_USER_ID
            APP_LOGIN_RATE_LIMIT_KEY
            APP_ORIGIN
            GOOGLE_CLOUD_VISION_API_KEY
            YAHOO_SHOPPING_CLIENT_ID
            GOOGLE_HEALTH_CLIENT_ID
            GOOGLE_HEALTH_CLIENT_SECRET
            GOOGLE_HEALTH_REDIRECT_URI
            PROVIDER_TOKEN_ENCRYPTION_KEY
            CRON_SECRET
            SUPABASE_SERVICE_ROLE_KEY
            ACCOUNT_DELETION_STATUS_HMAC_KEY
            ACCOUNT_DELETION_ADMIN_ENVIRONMENT
            EXPECTED_SUPABASE_PROJECT_REF
          )
          missing=()
          for name in "${required[@]}"; do
            if ! grep -Eq "(^|[[:space:]])${name}([[:space:]]|$)" <<<"$output"; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]})); then
            printf 'Missing Production environment variables: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "All required Production environment variable names are present."

      - name: Pull non-sensitive Production environment for binding checks
        shell: bash
        run: |
          pnpm dlx vercel@48.2.0 env pull /tmp/production.env --environment=production --yes --token="${{ secrets.VERCEL_TOKEN }}" >/dev/null

      - name: Validate retrievable Production bindings
        shell: bash
        run: |
          node --env-file=/tmp/production.env --input-type=module - <<'NODE'
          const expectedProjectRef = "vyvnicyupcrsmtgdyypv";
          const expectedRedirect = "https://nutrition-sleep-app.vercel.app/api/health/google/callback";

          const checks = {
            google_redirect_uri: process.env.GOOGLE_HEALTH_REDIRECT_URI === expectedRedirect,
            deletion_environment: process.env.ACCOUNT_DELETION_ADMIN_ENVIRONMENT === "production",
            expected_project_ref: process.env.EXPECTED_SUPABASE_PROJECT_REF === expectedProjectRef,
          };

          const failed = Object.entries(checks).filter(([, ok]) => !ok).map(([name]) => name);
          for (const [name, ok] of Object.entries(checks)) {
            console.log(name + ": " + (ok ? "PASS" : "FAIL"));
          }
          if (failed.length) {
            console.error("Production binding validation failed: " + failed.join(", "));
            process.exit(1);
          }
          NODE
          rm -f /tmp/production.env

      - name: Document sensitive-value boundary
        shell: bash
        run: |
          echo "Sensitive Production values are validated by presence here and by runtime smoke after deployment."
          echo "Vercel does not re-export sensitive values through env pull, so preflight never attempts to print or recover them."
