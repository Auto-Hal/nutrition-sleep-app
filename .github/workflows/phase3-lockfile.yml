name: Phase 3 lockfile

on:
  push:
    branches:
      - phase/3-product-ingestion
    paths:
      - package.json
      - .github/workflows/phase3-lockfile.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
