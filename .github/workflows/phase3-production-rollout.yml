name: Phase 3 Production rollout

on:
  push:
    branches:
      - phase/3-product-ingestion
    paths:
      - .github/workflows/phase3-production-rollout.yml

permissions:
  contents: read

jobs:
  rollout:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e9da1e51925b5f085071b8912c76040c40dd42c4
      - name: Select dedicated Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_aTOsma3gZ9xkcFkGJ53dUCCO","projectId":"prj_WiPB989mXurOuIgVm8asfmfdPA6W"}
          JSON
      - name: Verify Production Cloud Vision secret injection
        shell: bash
        run: |
          npx --yes vercel@latest --token=${{ secrets.VERCEL_TOKEN }} env run -e production --             node -e 'if (!process.env.GOOGLE_CLOUD_VISION_API_KEY) { console.error("PRODUCTION_VISION_KEY_PRESENT=false"); process.exit(1); } console.log("PRODUCTION_VISION_KEY_PRESENT=true")'
      - name: Deploy main commit to Production
        shell: bash
        run: |
          npx --yes vercel@48.2.0 deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
